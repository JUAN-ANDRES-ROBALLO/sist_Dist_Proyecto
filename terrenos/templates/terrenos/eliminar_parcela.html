<!DOCTYPE html>
<html>
<body>
  <h2>Eliminar Parcela</h2>
  <form id="deleteParcelaForm">
    Finca Nombre: <input name="finca_nombre_p"><br>
    ID Parcela: <input name="id_parcela"><br>
    Usuario (opcional): <input name="usuario"><br>
    <button type="submit">Eliminar</button>
  </form>
  <script>
    document.getElementById('deleteParcelaForm').onsubmit = async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      const res = await fetch('/api/terrenos/parcela/eliminar/', {
        method: 'POST',
        body: JSON.stringify(data)
      });
      const r = await res.json();
      alert(r.success || r.error);
    };
  </script>
</body>
</html>
