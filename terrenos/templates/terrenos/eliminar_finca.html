<!DOCTYPE html>
<html>
<body>
  <h2>Eliminar Finca</h2>
  <form id="deleteFincaForm">
    ID Productor: <input name="id_productor"><br>
    Nombre Finca: <input name="nombre_finca"><br>
    <button type="submit">Eliminar</button>
  </form>
  <script>
    document.getElementById('deleteFincaForm').onsubmit = async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      const res = await fetch('/api/terrenos/finca/eliminar/', {
        method: 'POST',
        body: JSON.stringify(data)
      });
      const r = await res.json();
      alert(r.success || r.error);
    };
  </script>
</body>
</html>
