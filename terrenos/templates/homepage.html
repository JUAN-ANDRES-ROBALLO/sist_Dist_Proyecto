<!DOCTYPE html>
<html>
<head>
    <title>Homepage - Terrenos</title>
    <script>
        const userToken = localStorage.getItem('userToken');
        if (!userToken) {
            alert('Debe loguearse primero.');
            window.location.href = '/';
        }

        async function eliminarFinca(id_productor, nombre_finca) {
            const response = await fetch(`/api/finca/${id_productor}/${nombre_finca}/`, {
                method: 'DELETE',
                headers: {
                    'X-User-Token': userToken
                }
            });

            const data = await response.json();
            alert(data.message || data.error);
            location.reload();
        }

        async function eliminarParcela(id_productor_p, nombre_finca_p, id_parcela) {
            const response = await fetch(`/api/parcela/${id_productor_p}/${nombre_finca_p}/${id_parcela}/`, {
                method: 'DELETE',
                headers: {
                    'X-User-Token': userToken
                }
            });

            const data = await response.json();
            alert(data.message || data.error);
            location.reload();
        }

        async function cargarFincas() {
            const response = await fetch('/api/finca/', {
                headers: {
                    'X-User-Token': userToken
                }
            });
            const data = await response.json();
            const lista = document.getElementById('lista-fincas');
            lista.innerHTML = '';
            data.forEach(finca => {
                const item = document.createElement('li');
                item.innerHTML = `${finca.nombre_finca} (${finca.id_productor}) 
                <button onclick="eliminarFinca('${finca.id_productor}', '${finca.nombre_finca}')">Eliminar</button>`;
                lista.appendChild(item);
            });
        }

        async function cargarParcelas() {
            const response = await fetch('/api/parcela/', {
                headers: {
                    'X-User-Token': userToken
                }
            });
            const data = await response.json();
            const lista = document.getElementById('lista-parcelas');
            lista.innerHTML = '';
            data.forEach(parcela => {
                const item = document.createElement('li');
                item.innerHTML = `${parcela.id_parcela} (${parcela.nombre_finca_p}, ${parcela.id_productor_p}) 
                <button onclick="eliminarParcela('${parcela.id_productor_p}', '${parcela.nombre_finca_p}', '${parcela.id_parcela}')">Eliminar</button>`;
                lista.appendChild(item);
            });
        }

        window.onload = function() {
            cargarFincas();
            cargarParcelas();
        };
    </script>
</head>
<body>
    <h1>App Registro de Terrenos</h1>

    <h2>Agregar Finca</h2>
    <form onsubmit="event.preventDefault(); agregarFinca();">
        <input type="text" id="nombre_finca" placeholder="Nombre Finca"><br>
        <input type="text" id="ubicacion" placeholder="Ubicación"><br>
        <input type="text" id="tipo_de_suelo" placeholder="Tipo de Suelo"><br>
        <button type="submit">Agregar Finca</button>
    </form>

    <h2>Agregar Parcela</h2>
    <form onsubmit="event.preventDefault(); agregarParcela();">
        <input type="text" id="nombre_finca_p" placeholder="Nombre Finca (de la Parcela)"><br>
        <input type="text" id="id_parcela" placeholder="ID Parcela"><br>
        <input type="number" id="superficie" placeholder="Superficie"><br>
        <button type="submit">Agregar Parcela</button>
    </form>

    <h2>Listado de Fincas</h2>
    <ul id="lista-fincas"></ul>

    <h2>Listado de Parcelas</h2>
    <ul id="lista-parcelas"></ul>

    <br>
    <button onclick="location.href='/'">Volver a Homepage</button>

    <script>
        async function agregarFinca() {
            const userToken = localStorage.getItem('userToken');
            const nombre_finca = document.getElementById('nombre_finca').value;
            const ubicacion = document.getElementById('ubicacion').value;
            const tipo_de_suelo = document.getElementById('tipo_de_suelo').value;

            const response = await fetch('/api/finca/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-User-Token': userToken
                },
                body: JSON.stringify({
                    id_productor: userToken,
                    nombre_finca,
                    ubicacion,
                    tipo_de_suelo
                })
            });

            const data = await response.json();
            if (response.ok) {
                alert('Finca agregada.');
                location.reload();
            } else {
                alert(data.error || JSON.stringify(data));
            }
        }

        async function agregarParcela() {
            const userToken = localStorage.getItem('userToken');
            const nombre_finca_p = document.getElementById('nombre_finca_p').value;
            const id_parcela = document.getElementById('id_parcela').value;
            const superficie = document.getElementById('superficie').value;

            const response = await fetch('/api/parcela/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-User-Token': userToken
                },
                body: JSON.stringify({
                    id_productor_p: userToken,
                    nombre_finca_p,
                    id_parcela,
                    superficie
                })
            });

            const data = await response.json();
            if (response.ok) {
                alert('Parcela agregada.');
                location.reload();
            } else {
                alert(data.error || JSON.stringify(data));
            }
        }
    </script>
</body>
</html>
