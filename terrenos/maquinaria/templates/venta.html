<!DOCTYPE html>
<html>
<head>
    <title>Maquinaria en Venta</title>
    <script>
        const userToken = localStorage.getItem('userToken');
        if (!userToken) {
            alert('Debe loguearse primero.');
            window.location.href = 'http://localhost:8000/';
        }

        async function cargarVenta() {
            const response = await fetch('/api/venta/', {
                headers: {
                    'X-User-Token': userToken
                }
            });
            const data = await response.json();
            const lista = document.getElementById('lista-venta');
            lista.innerHTML = '';
            data.forEach(venta => {
                const item = document.createElement('li');
                item.innerHTML = `${venta.id_listado_v} - Maquinaria ${venta.id_maquinaria} - Propietario: ${venta.propietario} - Precio: ${venta.precio}
                <button onclick="comprar('${venta.id_listado_v}', '${venta.propietario}')">Comprar</button>`;
                lista.appendChild(item);
            });
        }

        async function comprar(id_listado_v, propietario) {
            if (propietario === userToken) {
                alert('No puede comprar su propia maquinaria.');
                return;
            }

            const response = await fetch(`/api/comprar/${id_listado_v}/`, {
                method: 'POST',
                headers: {
                    'X-User-Token': userToken
                }
            });
            const data = await response.json();
            alert(data.message || data.error);
        }

        window.onload = function() {
            cargarVenta();
        };
    </script>
</head>
<body>
    <h1>Maquinaria en Venta</h1>

    <ul id="lista-venta"></ul>

    <br>
    <button onclick="location.href='homepage.html'">Volver a Página Principal</button>
</body>
</html>
