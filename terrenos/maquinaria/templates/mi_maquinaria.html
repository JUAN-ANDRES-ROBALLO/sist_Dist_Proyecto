<!DOCTYPE html>
<html>
<head>
    <title>Mi Maquinaria</title>
    <script>
        const userToken = localStorage.getItem('userToken');
        if (!userToken) {
            alert('Debe loguearse primero.');
            window.location.href = 'http://localhost:8000/';
        }

        async function cargarMaquinaria() {
            const response = await fetch('/api/maquinaria/', {
                headers: {
                    'X-User-Token': userToken
                }
            });
            const data = await response.json();
            const lista = document.getElementById('lista-maquinaria');
            lista.innerHTML = '';
            data.forEach(maq => {
                const item = document.createElement('li');
                item.innerHTML = `${maq.id_maquinaria} - ${maq.tipo} ${maq.marca} ${maq.modelo} (${maq.año}) 
                <button onclick="eliminarMaquinaria('${maq.id_maquinaria}')">Eliminar</button>
                <button onclick="ponerEnVenta('${maq.id_maquinaria}')">Poner en Venta</button>
                <button onclick="ponerEnServicio('${maq.id_maquinaria}')">Poner en Servicio</button>`;
                lista.appendChild(item);
            });
        }

        async function eliminarMaquinaria(id_maquinaria) {
            const response = await fetch(`/api/maquinaria/${id_maquinaria}/`, {
                method: 'DELETE',
                headers: {
                    'X-User-Token': userToken
                }
            });
            const data = await response.json();
            alert(data.message || data.error);
            location.reload();
        }

        async function ponerEnVenta(id_maquinaria) {
            const precio = prompt('Ingrese precio:');
            if (precio) {
                const response = await fetch('/api/venta/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-Token': userToken
                    },
                    body: JSON.stringify({
                        id_maquinaria: id_maquinaria,
                        propietario: userToken,
                        precio: parseFloat(precio)
                    })
                });
                const data = await response.json();
                alert(data.message || JSON.stringify(data));
            }
        }

        async function ponerEnServicio(id_maquinaria) {
            const fecha_inicio = prompt('Ingrese fecha inicio (YYYY-MM-DD):');
            const fecha_fin = prompt('Ingrese fecha fin (YYYY-MM-DD):');
            if (fecha_inicio && fecha_fin) {
                const response = await fetch('/api/servicio/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-Token': userToken
                    },
                    body: JSON.stringify({
                        id_maquinaria: id_maquinaria,
                        propietario: userToken,
                        fecha_inicio: fecha_inicio,
                        fecha_fin: fecha_fin
                    })
                });
                const data = await response.json();
                alert(data.message || JSON.stringify(data));
            }
        }

        window.onload = function() {
            cargarMaquinaria();
        };
    </script>
</head>
<body>
    <h1>Mi Maquinaria</h1>

    <h2>Agregar Maquinaria</h2>
    <form onsubmit="event.preventDefault(); agregarMaquinaria();">
        <input type="text" id="tipo" placeholder="Tipo"><br>
        <input type="text" id="marca" placeholder="Marca"><br>
        <input type="text" id="modelo" placeholder="Modelo"><br>
        <input type="number" id="anio" placeholder="Año"><br>
        <button type="submit">Agregar Maquinaria</button>
    </form>

    <h2>Listado de Maquinaria</h2>
    <ul id="lista-maquinaria"></ul>

    <br>
    <button onclick="location.href='homepage.html'">Volver a Página Principal</button>

    <script>
        async function agregarMaquinaria() {
            const tipo = document.getElementById('tipo').value;
            const marca = document.getElementById('marca').value;
            const modelo = document.getElementById('modelo').value;
            const anio = document.getElementById('anio').value;

            const response = await fetch('/api/maquinaria/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-User-Token': userToken
                },
                body: JSON.stringify({
                    tipo,
                    marca,
                    modelo,
                    año: parseInt(anio)
                })
            });

            const data = await response.json();
            if (response.ok) {
                alert('Maquinaria agregada.');
                location.reload();
            } else {
                alert(data.error || JSON.stringify(data));
            }
        }
    </script>
</body>
</html>
