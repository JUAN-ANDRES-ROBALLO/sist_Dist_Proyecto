server {
    listen 80;

    location /usuarios/ {
        proxy_pass http://usuarios:8001/;
        proxy_set_header Host $host;
    }

    location /terrenos/ {
        proxy_pass http://terrenos:8002/;
        proxy_set_header Host $host;
    }

    location /maquinaria/ {
        proxy_pass http://maquinaria:8003/;
        proxy_set_header Host $host;
    }

    location /notificaciones/ {
        proxy_pass http://notificaciones:8004/;
        proxy_set_header Host $host;
    }

    # Redirección de API para login/signup
    location /api/ {
        proxy_pass http://usuarios:8001/api/;
        proxy_set_header Host $host;
    }

    # Fallback: sirve frontend del servicio de usuarios
    location / {
        proxy_pass http://usuarios:8001/;
        proxy_set_header Host $host;
    }
}

