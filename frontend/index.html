<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Agrícola</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Pantalla inicial -->
        <div id="initial-screen" class="screen active">
            <div class="container">
                <h1>Sistema de Gestión Agrícola</h1>
                <div class="button-group">
                    <button onclick="showLogin()" class="btn btn-primary">Login</button>
                    <button onclick="showSignup()" class="btn btn-secondary">Signup</button>
                </div>
            </div>
        </div>

        <!-- Pantalla login -->
        <div id="login-screen" class="screen">
            <div class="container">
                <h2>Iniciar Sesión</h2>
                <form id="login-form" class="form">
                    <div class="form-group">
                        <label for="login-email">Email:</label>
                        <input type="email" id="login-email" name="email" required>
                        <small class="help-text">Formato de correo electrónico válido</small>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Contraseña:</label>
                        <input type="password" id="login-password" name="password" required>
                        <small class="help-text">Texto libre</small>
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">Login</button>
                        <button type="button" onclick="showInitial()" class="btn btn-secondary">Volver</button>
                    </div>
                </form>
                <div id="login-error" class="error-message"></div>
            </div>
        </div>

        <!-- Pantalla signup -->
        <div id="signup-screen" class="screen">
            <div class="container">
                <h2>Registrarse</h2>
                <form id="signup-form" class="form">
                    <div class="form-group">
                        <label for="signup-cedula">Cédula:</label>
                        <input type="text" id="signup-cedula" name="cedula" maxlength="10" required>
                        <small class="help-text">Texto, máximo 10 caracteres</small>
                    </div>
                    <div class="form-group">
                        <label for="signup-nombre">Nombre:</label>
                        <input type="text" id="signup-nombre" name="nombre" maxlength="100" required>
                        <small class="help-text">Texto, máximo 100 caracteres</small>
                    </div>
                    <div class="form-group">
                        <label for="signup-email">Email:</label>
                        <input type="email" id="signup-email" name="email" required>
                        <small class="help-text">Formato de correo electrónico válido</small>
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Contraseña:</label>
                        <input type="password" id="signup-password" name="password" required>
                        <small class="help-text">Texto libre</small>
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">Registrarse</button>
                        <button type="button" onclick="showInitial()" class="btn btn-secondary">Volver</button>
                    </div>
                </form>
                <div id="signup-error" class="error-message"></div>
            </div>
        </div>

        <!-- Pantalla homepage -->
        <div id="homepage-screen" class="screen">
            <div class="container">
                <h2>Bienvenido, <span id="user-name"></span></h2>
                <div class="menu-grid">
                    <button onclick="navigateToTerrenos()" class="menu-item">
                        <h3>Registro de Terrenos</h3>
                        <p>Gestiona tus fincas y parcelas</p>
                    </button>
                    <button onclick="navigateToMaquinaria()" class="menu-item">
                        <h3>Registro Venta y Servicio de Maquinaria</h3>
                        <p>Administra tu maquinaria</p>
                    </button>
                    <button onclick="navigateToNotificaciones()" class="menu-item">
                        <h3>Notificaciones</h3>
                        <p>Revisa tus notificaciones</p>
                    </button>
                </div>
                <button onclick="logout()" class="btn btn-danger">Logout</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
