<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Finca - Sistema Agrícola</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .success-message {
            color: #40c057;
            background: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .error-message {
            color: #dc3545;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
        }
        
        .help-text {
            display: block;
            margin-top: 8px;
            font-size: 0.8em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="section">
            <h1>Agregar Finca</h1>
            <p>Usuario: <span id="user-name"></span></p>
            <button onclick="volverTerrenos()" class="btn btn-secondary">Volver a Terrenos</button>
        </div>

        <div class="section">
            <h2>Datos de la Finca</h2>
            <form id="agregar-finca-form">
                <div class="form-group">
                    <label for="nombre-finca">Nombre de la Finca:</label>
                    <input type="text" id="nombre-finca" name="nombre_finca" maxlength="100" required>
                    <small class="help-text">Texto, máximo 100 caracteres</small>
                </div>
                
                <div class="form-group">
                    <label for="ubicacion">Ubicación:</label>
                    <input type="text" id="ubicacion" name="ubicacion" maxlength="200" required>
                    <small class="help-text">Texto, máximo 200 caracteres</small>
                </div>
                
                <div class="form-group">
                    <label for="tipo-suelo">Tipo de Suelo:</label>
                    <input type="text" id="tipo-suelo" name="tipo_de_suelo" maxlength="50" required>
                    <small class="help-text">Texto, máximo 50 caracteres</small>
                </div>
                
                <div class="form-group">
                    <label for="fecha-registro">Fecha de Registro:</label>
                    <input type="datetime-local" id="fecha-registro" name="fecha_registro_finca">
                    <small class="help-text">Fecha y hora (opcional)</small>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Agregar</button>
                    <button type="button" onclick="volverTerrenos()" class="btn btn-secondary">Volver</button>
                </div>
            </form>
            <div id="mensajes"></div>
        </div>
    </div>

    <script>
        let currentUser = null;

        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const userParam = urlParams.get('user');
            if (userParam) {
                try {
                    currentUser = JSON.parse(decodeURIComponent(userParam));
                    document.getElementById('user-name').textContent = currentUser.nombre;
                } catch (e) {
                    console.error('Error parsing user data:', e);
                    volverTerrenos();
                }
            } else {
                volverTerrenos();
            }
        });

        function volverTerrenos() {
            const url = new URL('/terrenos.html', window.location.origin);
            if (currentUser) {
                url.searchParams.set('user', JSON.stringify(currentUser));
            }
            window.location.href = url.toString();
        }

        function mostrarMensaje(mensaje, tipo = 'success') {
            const mensajesDiv = document.getElementById('mensajes');
            const mensajeDiv = document.createElement('div');
            mensajeDiv.className = tipo === 'success' ? 'success-message' : 'error-message';
            mensajeDiv.textContent = mensaje;
            mensajesDiv.appendChild(mensajeDiv);
            
            setTimeout(() => {
                mensajeDiv.remove();
            }, 5000);
        }

        async function apiCall(url, options = {}) {
            try {
                const response = await fetch(url, {
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    },
                    ...options
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Error en la petición');
                }
                
                return data;
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }

        document.getElementById('agregar-finca-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            try {
                const formData = new FormData(this);
                
                const data = {
                    id_productor: currentUser.cedula,
                    nombre_finca: formData.get('nombre_finca'),
                    ubicacion: formData.get('ubicacion'),
                    tipo_de_suelo: formData.get('tipo_de_suelo'),
                    fecha_registro_finca: formData.get('fecha_registro_finca') || new Date().toISOString()
                };

                await apiCall('/api/terrenos/fincas/agregar/', {
                    method: 'POST',
                    body: JSON.stringify(data)
                });

                mostrarMensaje('Finca agregada exitosamente');
                this.reset();
                
                // Redirigir después de 2 segundos
                setTimeout(() => {
                    volverTerrenos();
                }, 2000);
            } catch (error) {
                mostrarMensaje(error.message, 'error');
            }
        });
    </script>
</body>
</html>
