<!DOCTYPE html>
<html>
<head>
    <title>Maquinaria en Servicio</title>
    <script>
        const userToken = localStorage.getItem('userToken');
        if (!userToken) {
            alert('Debe loguearse primero.');
            window.location.href = '/';
        }

        async function cargarServicio() {
            const response = await fetch('/api/servicio/', {
                headers: {
                    'X-User-Token': userToken
                }
            });
            const data = await response.json();
            const lista = document.getElementById('lista-servicio');
            lista.innerHTML = '';
            data.forEach(servicio => {
                const item = document.createElement('li');
                item.innerHTML = `${servicio.id_listado_r} - Maquinaria ${servicio.id_maquinaria} - Propietario: ${servicio.propietario} - Fecha Inicio: ${servicio.fecha_inicio} - Fecha Fin: ${servicio.fecha_fin}
                <button onclick="pedirServicio('${servicio.id_listado_r}', '${servicio.propietario}')">Pedir Servicio</button>`;
                lista.appendChild(item);
            });
        }

        async function pedirServicio(id_listado_r, propietario) {
            if (propietario === userToken) {
                alert('No puede pedir su propio servicio.');
                return;
            }

            const response = await fetch(`/api/pedir_servicio/${id_listado_r}/`, {
                method: 'POST',
                headers: {
                    'X-User-Token': userToken
                }
            });
            const data = await response.json();
            alert(data.message || data.error);
        }

        window.onload = function() {
            cargarServicio();
        };
    </script>
</head>
<body>
    <h1>Maquinaria en Servicio</h1>

    <ul id="lista-servicio"></ul>

    <br>
    <button onclick="location.href='homepage.html'">Volver a Página Principal</button>
</body>
</html>
