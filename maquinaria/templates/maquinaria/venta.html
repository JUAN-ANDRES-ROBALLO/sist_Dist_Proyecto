<!DOCTYPE html>
<html>
<head><title>Maquinaria en Venta</title></head>
<body>
  <h2>Maquinaria Disponible para Comprar</h2>
  <div id="listado"></div>
  <a href="/maquinaria/">Volver</a>
  <script>
    async function cargar() {
      const res = await fetch("/api/maquinaria/venta/listar/");
      const data = await res.json();
      const div = document.getElementById("listado");
      div.innerHTML = "";
      for (const v of data.ventas) {
        const btn = document.createElement("button");
        btn.textContent = "Comprar";
        btn.onclick = async () => {
          const r = await fetch("/api/maquinaria/venta/comprar/", {
            method: "POST",
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id: v.id })
          });
          const res = await r.json();
          alert(res.success || res.error);
        };
        div.innerHTML += `
          <p>
            ${v.tipo} - ${v.marca} (${v.anio}) - $${v.precio}<br>
            Vendedor: ${v.vendedor} (${v.email})
          </p>`;
        div.appendChild(btn);
        div.appendChild(document.createElement("hr"));
      }
    }
    cargar();
  </script>
</body>
</html>
