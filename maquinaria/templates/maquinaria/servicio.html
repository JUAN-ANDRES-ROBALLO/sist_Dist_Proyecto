<!DOCTYPE html>
<html>
<head><title>Maquinaria en Servicio</title></head>
<body>
  <h2>Maquinaria Disponible para Servicio</h2>
  <div id="listado"></div>
  <a href="/maquinaria/">Volver</a>
  <script>
    async function cargar() {
      const res = await fetch("/api/maquinaria/servicio/listar/");
      const data = await res.json();
      const div = document.getElementById("listado");
      div.innerHTML = "";
      for (const v of data.servicios) {
        const form = document.createElement("form");
        form.innerHTML = `
          <p>
            ${v.tipo} - ${v.marca} (${v.anio})<br>
            Dueño: ${v.vendedor} (${v.email})<br>
            Fecha Inicio: <input type="date" name="fecha_inicio"><br>
            Fecha Fin: <input type="date" name="fecha_fin"><br>
            <button type="submit">Pedir</button>
          </p>
        `;
        form.onsubmit = async (e) => {
          e.preventDefault();
          const fi = form.fecha_inicio.value;
          const ff = form.fecha_fin.value;
          const r = await fetch("/api/maquinaria/servicio/pedir/", {
            method: "POST",
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id: v.id, fecha_inicio: fi, fecha_fin: ff })
          });
          const res = await r.json();
          alert(res.success || res.error);
        };
        div.appendChild(form);
        div.appendChild(document.createElement("hr"));
      }
    }
    cargar();
  </script>
</body>
</html>
