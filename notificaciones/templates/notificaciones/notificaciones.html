<!DOCTYPE html>
<html>
<head>
  <title>Notificaciones</title>
</head>
<body>
  <h1>Mis notificaciones</h1>
  <ul id="notificaciones"></ul>

  <script>
    async function cargarNotificaciones() {
      const res = await fetch('');
      const data = await res.json();
      const ul = document.getElementById('notificaciones');
      ul.innerHTML = '';

      data.notificaciones.forEach(n => {
        const li = document.createElement('li');
        li.innerHTML = `
          <strong>${n.tipo}</strong>: ${n.contenido} (${n.fecha})
          <button onclick="eliminar(${n.id})">Eliminar</button>
        `;
        ul.appendChild(li);
      });
    }

    async function eliminar(id) {
      const res = await fetch(`eliminar/${id}/`, { method: 'DELETE' });
      const data = await res.json();
      alert(data.success || data.error);
      cargarNotificaciones();
    }

    cargarNotificaciones();
  </script>

  <a href="/usuarios/homepage/">Volver al inicio</a>
</body>
</html>
