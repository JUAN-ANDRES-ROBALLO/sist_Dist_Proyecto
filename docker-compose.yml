version: '3.9'

services:

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_DB: agricola
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
        - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - usuarios
      - terrenos
      - maquinaria
      - notificaciones

  usuarios:
    build: ./usuarios
    container_name: usuarios
    command: gunicorn usuarios.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./usuarios:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      - DJANGO_SETTINGS_MODULE=usuarios.settings

  terrenos:
    build: ./terrenos
    container_name: terrenos
    command: gunicorn terrenos.wsgi:application --bind 0.0.0.0:8001
    volumes:
      - ./terrenos:/app
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - rabbitmq

  maquinaria:
    build: ./maquinaria
    container_name: maquinaria
    command: gunicorn maquinaria.wsgi:application --bind 0.0.0.0:8002
    volumes:
      - ./maquinaria:/app
    ports:
      - "8002:8002"
    depends_on:
      - postgres
      - rabbitmq

  notificaciones:
    build: ./notificaciones
    container_name: notificaciones
    command: gunicorn notificaciones.wsgi:application --bind 0.0.0.0:8003
    volumes:
      - ./notificaciones:/app
    ports:
      - "8003:8003"
    depends_on:
      - postgres
      - rabbitmq

volumes:
  pgdata:

