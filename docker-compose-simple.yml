version: '3.8'

services:
  # Base de datos
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: farm_db
      POSTGRES_USER: farm_user
      POSTGRES_PASSWORD: farm_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - farm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Broker de mensajes
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: farm_user
      RABBITMQ_DEFAULT_PASS: farm_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - farm_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Microservicio Usuarios
  usuarios:
    build: ./usuarios
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://farm_user:farm_password@postgres:5432/usuarios_db
      - RABBITMQ_URL=amqp://farm_user:farm_password@rabbitmq:5672/
      - DJANGO_SECRET_KEY=django-secret-key-change-in-production
      - DJANGO_DEBUG=True
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - farm_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/usuarios/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Microservicio Terrenos
  terrenos:
    build: ./terrenos
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql://farm_user:farm_password@postgres:5432/terrenos_db
      - RABBITMQ_URL=amqp://farm_user:farm_password@rabbitmq:5672/
      - DJANGO_SECRET_KEY=django-secret-key-change-in-production
      - DJANGO_DEBUG=True
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - farm_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/terrenos/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Microservicio Maquinaria
  maquinaria:
    build: ./maquinaria
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=postgresql://farm_user:farm_password@postgres:5432/maquinaria_db
      - RABBITMQ_URL=amqp://farm_user:farm_password@rabbitmq:5672/
      - DJANGO_SECRET_KEY=django-secret-key-change-in-production
      - DJANGO_DEBUG=True
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - farm_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/maquinaria/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Microservicio Notificaciones
  notificaciones:
    build: ./notificaciones
    ports:
      - "8004:8000"
    environment:
      - DATABASE_URL=postgresql://farm_user:farm_password@postgres:5432/notificaciones_db
      - RABBITMQ_URL=amqp://farm_user:farm_password@rabbitmq:5672/
      - DJANGO_SECRET_KEY=django-secret-key-change-in-production
      - DJANGO_DEBUG=True
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - farm_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/notificaciones/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx (Proxy reverso)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      usuarios:
        condition: service_healthy
      terrenos:
        condition: service_healthy
      maquinaria:
        condition: service_healthy
      notificaciones:
        condition: service_healthy
    networks:
      - farm_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Service
  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./FrontEnd:/app
      - /app/node_modules
    networks:
      - farm_network
    restart: unless-stopped

  # Workers de Celery
  usuarios-worker:
    build: ./usuarios
    command: celery -A usuarios worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://farm_user:farm_password@postgres:5432/usuarios_db
      - RABBITMQ_URL=amqp://farm_user:farm_password@rabbitmq:5672/
      - DJANGO_SECRET_KEY=django-secret-key-change-in-production
      - DJANGO_DEBUG=True
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - farm_network
    restart: unless-stopped

  terrenos-worker:
    build: ./terrenos
    command: celery -A terrenos worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://farm_user:farm_password@postgres:5432/terrenos_db
      - RABBITMQ_URL=amqp://farm_user:farm_password@rabbitmq:5672/
      - DJANGO_SECRET_KEY=django-secret-key-change-in-production
      - DJANGO_DEBUG=True
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - farm_network
    restart: unless-stopped

  maquinaria-worker:
    build: ./maquinaria
    command: celery -A maquinaria worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://farm_user:farm_password@postgres:5432/maquinaria_db
      - RABBITMQ_URL=amqp://farm_user:farm_password@rabbitmq:5672/
      - DJANGO_SECRET_KEY=django-secret-key-change-in-production
      - DJANGO_DEBUG=True
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - farm_network
    restart: unless-stopped

  notificaciones-worker:
    build: ./notificaciones
    command: celery -A notificaciones worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://farm_user:farm_password@postgres:5432/notificaciones_db
      - RABBITMQ_URL=amqp://farm_user:farm_password@rabbitmq:5672/
      - DJANGO_SECRET_KEY=django-secret-key-change-in-production
      - DJANGO_DEBUG=True
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - farm_network
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  farm_network:
    driver: bridge 