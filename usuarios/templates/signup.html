<!DOCTYPE html>
<html>
<head>
    <title>Signup - Usuario</title>
    <script>
        async function signup() {
            const cedula = document.getElementById('cedula').value;
            const nombre = document.getElementById('nombre').value;
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value;
            const estado = document.getElementById('estado').value;

            const response = await fetch('/api/signup/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({cedula, nombre, password, email, estado})
            });

            const data = await response.json();
            if (response.ok) {
                alert('Usuario creado exitosamente.');
                window.location.href = 'homepage.html';
            } else {
                alert(data.error || JSON.stringify(data));
            }
        }
    </script>
</head>
<body>
    <h1>Signup</h1>
    <input type="text" id="cedula" placeholder="Cédula"><br>
    <input type="text" id="nombre" placeholder="Nombre"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <input type="text" id="email" placeholder="Email"><br>
    <input type="text" id="estado" placeholder="Estado"><br>
    <button onclick="location.href='/'">Signup</button>
    <button onclick="location.href='/'">Volver</button>
</body>
</html>
